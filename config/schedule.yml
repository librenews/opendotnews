dispatch_outbox_sweeper:
  cron: "* * * * *"
  class: "Events::DispatchOutboxJob"
  queue: "scheduled"
  description: "Sweep any undispatched transactional outbox events"

schedule_due_feeds:
  cron: "* * * * *"
  class: "Feeds::ScheduleDueJob"
  queue: "scheduled"
  description: "Enqueue shared feed fetches that are due for polling"

renew_upstream_push:
  cron: "*/15 * * * *"
  class: "Push::RenewUpstreamJob"
  queue: "scheduled"
  description: "Renew expiring WebSub/rssCloud upstream push leases and recover staged payloads"

retry_due_deliveries:
  cron: "* * * * *"
  class: "Delivery::RetryDueJob"
  queue: "scheduled"
  description: "Retry due downstream WebSub and rssCloud push deliveries"

expire_downstream_leases:
  cron: "*/15 * * * *"
  class: "Maintenance::ExpireLeasesJob"
  queue: "maintenance"
  description: "Expire lapsed downstream WebSub and rssCloud subscriptions"

purge_expired_inbox:
  cron: "0 3 * * *"
  class: "Maintenance::PurgeExpiredInboxJob"
  queue: "maintenance"
  description: "Prune user_inbox_events older than configured retention window"
