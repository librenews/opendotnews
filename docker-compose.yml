services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: open_news
      POSTGRES_PASSWORD: open_news_dev_password
      POSTGRES_DB: opendotnews_development
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_news"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: bundle exec puma -C config/puma.rb
    environment:
      RAILS_ENV: development
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://open_news:open_news_dev_password@postgres:5432/opendotnews_development
      REDIS_URL: redis://redis:6379/0
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      RAILS_ENV: development
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://open_news:open_news_dev_password@postgres:5432/opendotnews_development
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
